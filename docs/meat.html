<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>گوشت کا حساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<link rel="stylesheet" href="report.css">
</head>
<body>
<main>
  <div id="capture">
    <div class="card">
      <div class="title">
        <div class="date" id="date"></div>
        <div class="label">گوشت کا حساب</div>
      </div>
      <table><tbody id="rows"></tbody></table>
    </div>
    <div class="paid" id="paid" hidden>ادا شدہ ✓</div>
  </div>
  <div class="actions">
    <button id="share" type="button">Share image</button>
    <button id="copy" type="button">Copy image</button>
  </div>
  <div class="more"><button id="pdf" type="button">Save PDF</button></div>
  <div id="status"></div>
</main>

<script src="report.js"></script>
<script>
  // Link format (memento/bone/report-button.js):
  // #d=YYYY-MM-DD&i=<items joined by _>&disc=<rupees>&paid=0|1
  // Each item is code~weight~rate~price; codes match ITEMS below.
  var ITEMS = {
    bl: ["بون لیس گوشت", "Boneless Beef", "kg"],
    bi: ["ہڈی والا گوشت", "Bone-in Beef", "kg"],
    ft: ["چری", "Fatty Trimming", "kg"],
    sb: ["ہڈی", "Soup Bones", "kg"],
    mi: ["قیمہ", "Mince", "kg"],
    mb: ["نلی", "Marrow Bones", "kg"],
    lv: ["کلیجی", "Liver", "kg"],
    tr: ["پائے", "Trotters", "عدد"],
    tp: ["اوجھڑی", "Tripe", "kg"]
  };
  var rs = Report.rs, amount = Report.amount;

  function parse(hash) {
    var params = new URLSearchParams(hash.replace(/^#/, ""));
    var lines = (params.get("i") || "").split("_").filter(Boolean).map(function (line) {
      var p = line.split("~");
      return ITEMS[p[0]] ? { item: ITEMS[p[0]], weight: amount(p[1]), rate: amount(p[2]), price: amount(p[3]) } : null;
    }).filter(function (l) { return l && l.price > 0; });
    return {
      date: Report.date(params.get("d")),
      lines: lines,
      discount: amount(params.get("disc")),
      paid: params.get("paid") === "1"
    };
  }

  function render(data) {
    document.getElementById("date").textContent = Report.humanDate(data.date);
    var rows = document.getElementById("rows");
    rows.textContent = "";
    var total = 0;
    data.lines.forEach(function (l) {
      total += l.price;
      var unit = l.item[2] === "kg" ? "kg" : Report.isolate(l.item[2]);
      rows.appendChild(Report.itemRow(l.item[0], l.item[1], [
        l.weight > 0 && ["w", l.weight + " " + unit],
        l.rate > 0 && ["r", rs(l.rate) + " / " + unit]
      ], l.price));
    });
    if (!data.lines.length) rows.appendChild(Report.emptyRow());
    var discounted = data.discount > 0;
    if (discounted) {
      rows.appendChild(Report.sumRow("subtotal", "کل رقم", "Gross total", rs(total)));
      rows.appendChild(Report.sumRow("discount", "رعایت", "Discount", "− " + rs(data.discount)));
    }
    rows.appendChild(Report.sumRow("net", "کُل رقم", discounted ? "Net total" : "Total", rs(total - data.discount)));
    document.getElementById("paid").hidden = !data.paid;
    document.title = "گوشت کا حساب " + data.date;
  }

  Report.setupActions(function () { return "meat-" + (parse(location.hash).date || "report") + ".png"; });
  Report.start(parse, render);
</script>
</body>
</html>
