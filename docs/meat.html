<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>گوشت کا حساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #0f4c5c;
    --brand-soft: #cfe3e8;
    --soft: #f1f5f9;
    --loss: #b91c1c;
    --loss-soft: #fef2f2;
    --ok: #15803d;
    --urdu: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif;
    --latin: system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e8eef1; color: var(--ink); font-family: var(--urdu); }
  main { max-width: 440px; margin: 0 auto; padding: 16px; }

  #capture { background: #ffffff; padding: 10px; border-radius: 16px; }
  .card { border: 1.5px solid var(--brand); border-radius: 14px; overflow: hidden; }
  .title { background: var(--brand); color: #ffffff; text-align: center; padding: 10px 12px 4px; }
  .title .date { font-family: var(--latin); font-size: 24px; font-weight: 800; direction: ltr; }
  .title .label { font-size: 16px; line-height: 1.9; color: var(--brand-soft); }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .num { font-family: var(--latin); direction: ltr; unicode-bidi: isolate; }
  td.name { text-align: right; }
  td.name .ur { font-size: 19px; line-height: 1.9; }
  td.name .en { font-family: var(--latin); font-size: 11px; color: var(--muted); direction: ltr; text-align: right; }
  td.qty { text-align: center; white-space: nowrap; padding: 6px 4px; }
  td.qty .w { display: block; font-size: 16px; font-weight: 600; }
  td.qty .r { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  td.amt { text-align: left; white-space: nowrap; font-size: 18px; font-weight: 700; }

  tr.sum td { line-height: 1.9; padding: 4px 12px; }
  tr.sum td.label { text-align: center; }
  tr.subtotal td { background: var(--soft); font-size: 18px; font-weight: 700; }
  tr.discount td { background: var(--loss-soft); color: var(--loss); font-size: 17px; }
  tr.net td { background: var(--brand); color: #ffffff; font-size: 21px; font-weight: 800; border-bottom: none; }
  .empty { padding: 18px; text-align: center; color: var(--muted); font-size: 17px; }

  .paid {
    margin: 12px auto 2px; width: max-content; padding: 0 20px;
    border: 2.5px solid var(--ok); border-radius: 10px; color: var(--ok);
    font-size: 19px; line-height: 1.9; transform: rotate(-4deg);
  }

  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions button {
    flex: 1; min-height: 48px; border: 0; border-radius: 12px;
    font-family: var(--latin); font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #share { background: var(--brand); color: #ffffff; }
  #pdf { background: #ffffff; color: var(--brand); border: 1.5px solid var(--brand); }
  #status { margin-top: 10px; text-align: center; font-family: var(--latin); font-size: 13px; color: var(--muted); direction: ltr; }

  @media print {
    @page { size: A5; margin: 8mm; }
    body { background: #ffffff; }
    main { padding: 0; max-width: none; }
    #capture { padding: 0; }
    .actions, #status { display: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<main>
  <div id="capture">
    <div class="card">
      <div class="title">
        <div class="date" id="date"></div>
        <div class="label">گوشت کا حساب</div>
      </div>
      <table><tbody id="rows"></tbody></table>
    </div>
    <div class="paid" id="paid" hidden>ادا شدہ ✓</div>
  </div>
  <div class="actions">
    <button id="share" type="button">Share image</button>
    <button id="pdf" type="button">Save PDF</button>
  </div>
  <div id="status"></div>
</main>

<script>
  // Codes match memento/bone/report-button.js.
  var ITEMS = {
    bl: ["بون لیس گوشت", "Boneless Beef", "kg"],
    bi: ["ہڈی والا گوشت", "Bone-in Beef", "kg"],
    ft: ["چری", "Fatty Trimming", "kg"],
    sb: ["ہڈی", "Soup Bones", "kg"],
    mi: ["قیمہ", "Mince", "kg"],
    mb: ["نلی", "Marrow Bones", "kg"],
    lv: ["کلیجی", "Liver", "kg"],
    tr: ["پائے", "Trotters", "عدد"],
    tp: ["اوجھڑی", "Tripe", "kg"]
  };

  function rs(n) {
    return "Rs " + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function amount(n) {
    var v = Number(n);
    return isFinite(v) && v > 0 ? v : 0;
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function unitText(unit) {
    return unit === "kg" ? "kg" : "⁨" + unit + "⁩";
  }

  function parse(hash) {
    var params = new URLSearchParams(hash.replace(/^#/, ""));
    var lines = (params.get("i") || "").split("_").filter(Boolean).map(function (line) {
      var p = line.split("~");
      return ITEMS[p[0]] ? { item: ITEMS[p[0]], weight: amount(p[1]), rate: amount(p[2]), price: amount(p[3]) } : null;
    }).filter(function (l) { return l && l.price > 0; });
    var date = params.get("d") || "";
    return {
      date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : "",
      lines: lines,
      discount: amount(params.get("disc")),
      paid: params.get("paid") === "1"
    };
  }

  function sumRow(cls, label, value) {
    var tr = el("tr", "sum " + cls);
    var l = el("td", "label", label);
    l.colSpan = 2;
    tr.appendChild(l);
    var a = el("td", "amt");
    a.appendChild(el("span", "num", value));
    tr.appendChild(a);
    return tr;
  }

  function render(data) {
    document.getElementById("date").textContent = data.date;
    var rows = document.getElementById("rows");
    rows.textContent = "";
    var total = 0;
    data.lines.forEach(function (l) {
      total += l.price;
      var tr = el("tr");
      var name = el("td", "name");
      name.appendChild(el("div", "ur", l.item[0]));
      name.appendChild(el("div", "en", l.item[1]));
      var qty = el("td", "qty num");
      var unit = unitText(l.item[2]);
      if (l.weight > 0) qty.appendChild(el("span", "w", l.weight + " " + unit));
      if (l.rate > 0) qty.appendChild(el("span", "r", rs(l.rate) + " / " + unit));
      var amt = el("td", "amt");
      amt.appendChild(el("span", "num", rs(l.price)));
      tr.appendChild(name);
      tr.appendChild(qty);
      tr.appendChild(amt);
      rows.appendChild(tr);
    });
    if (!data.lines.length) {
      var tr = el("tr");
      var td = el("td", "empty", "ابھی کوئی چیز درج نہیں");
      td.colSpan = 3;
      tr.appendChild(td);
      rows.appendChild(tr);
    }
    if (data.discount > 0) {
      rows.appendChild(sumRow("subtotal", "کل رقم", rs(total)));
      rows.appendChild(sumRow("discount", "رعایت", "− " + rs(data.discount)));
    }
    rows.appendChild(sumRow("net", "ٹوٹل رقم", rs(total - data.discount)));
    document.getElementById("paid").hidden = !data.paid;
    document.title = "گوشت کا حساب " + data.date;
  }

  var status = document.getElementById("status");
  function fileName() {
    return "meat-" + (parse(location.hash).date || "report") + ".png";
  }

  document.getElementById("share").addEventListener("click", function () {
    status.textContent = "Preparing image…";
    document.fonts.ready
      .then(function () {
        return htmlToImage.toBlob(document.getElementById("capture"), { pixelRatio: 3, backgroundColor: "#ffffff" });
      })
      .then(function (blob) {
        var file = new File([blob], fileName(), { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          status.textContent = "";
          return navigator.share({ files: [file] });
        }
        var a = el("a");
        a.href = URL.createObjectURL(blob);
        a.download = file.name;
        a.click();
        status.textContent = "Image downloaded.";
      })
      .catch(function (err) {
        if (err && err.name === "AbortError") { status.textContent = ""; return; }
        status.textContent = "Could not share the image: " + (err && err.message || err);
      });
  });
  document.getElementById("pdf").addEventListener("click", function () { window.print(); });

  render(parse(location.hash));
  window.addEventListener("hashchange", function () { render(parse(location.hash)); });
</script>
</body>
</html>
